[workspace]
resolver = "2"
members = [
    "crates/common-text",
    "crates/epub-lib",
    "crates/progress-db",
    "crates/services",
    "crates/http-server",
    "crates/leptos-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["lizhaoming1"]
license = "MIT"
repository = "https://github.com/lizhaoming1/miniflux-reader-rs"
description = "Rust rewrite of miniflux-reader: Axum + Leptos 0.7 SSR + Hydration MVP"
rust-version = "1.92"

[workspace.dependencies]
# ---- HTTP ----
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie-signed", "cookie", "multipart", "form"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "cookies"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "fs"] }
bytes = "1"
http  = "1"

# ---- Async / Runtime ----
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"

# ---- Leptos 0.7 ----
leptos = { version = "0.7", default-features = false }
leptos_axum = { version = "0.7", default-features = false }
leptos_meta = { version = "0.7", default-features = false }
leptos_router = { version = "0.7", default-features = false }

# ---- DB ----
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }

# ---- HTML / EPUB / Text ----
scraper = "0.21"
html5ever = "0.27"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.36", features = ["serialize"] }
sanitize-filename = "0.6"
sha1_smol = "1"

# ---- Serialization ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- Errors / Observability ----
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ---- Testing ----
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
