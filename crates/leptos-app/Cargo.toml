[package]
name = "leptos-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Leptos 0.7 views: Bookshelf, BookReader, MinifluxArticle + #[server] fns. Compiles both as ssr (axum) and as csr (wasm hydration)."

[lib]
crate-type = ["lib", "cdylib", "rlib"]

# Feature forwarding: only the `leptos` crate has `ssr`/`csr`/`hydrate`
# features in 0.7. leptos_axum / leptos_meta / leptos_router are
# controlled by the same global `leptos` feature, NOT by per-crate flags.
[features]
default = []
ssr     = ["leptos/ssr"]
csr     = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
nightly = ["leptos/nightly"]

[dependencies]
leptos         = { workspace = true, default-features = false }
leptos_axum    = { workspace = true, default-features = false }
leptos_meta    = { workspace = true, default-features = false }
leptos_router  = { workspace = true, default-features = false }
serde          = { workspace = true }
common-text    = { path = "../common-text" }

[dev-dependencies]
leptos_dom_test = { workspace = true }
