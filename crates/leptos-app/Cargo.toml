[package]
name = "leptos-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Leptos 0.7 views: Bookshelf, BookReader, MinifluxArticle + #[server] fns. Compiles both as ssr (axum) and as csr (wasm hydration)."

[lib]
crate-type = ["lib", "cdylib", "rlib"]

[features]
default = []
ssr  = ["leptos/ssr",  "leptos_axum/ssr",  "leptos_meta/ssr",  "leptos_router/ssr"]
csr  = ["leptos/csr",  "leptos_axum/csr",  "leptos_meta/csr",  "leptos_router/csr"]
hydrate = ["leptos/hydrate"]
nightly = ["leptos/nightly"]

[dependencies]
leptos       = { workspace = true, default-features = false }
leptos_axum  = { workspace = true, default-features = false, optional = true }
leptos_meta  = { workspace = true, default-features = false, optional = true }
leptos_router = { workspace = true, default-features = false, optional = true }
serde = { workspace = true }
common-text = { path = "../common-text" }

[dev-dependencies]
leptos_dom_test = { workspace = true }
