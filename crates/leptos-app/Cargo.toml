[package]
name = "leptos-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Leptos 0.7 views: Bookshelf, BookReader, ArticleReader, FeedList, SettingsPage + router. Compiles both as ssr (axum) and as csr (wasm hydration)."

[lib]
crate-type = ["lib", "cdylib"]

# Only the `leptos` crate has `ssr`/`csr`/`hydrate` feature bits in 0.7.
# The integration crates (leptos_axum / leptos_meta / leptos_router) are
# always compiled in the matching mode without per-crate feature toggles.
[features]
default = []
ssr     = ["leptos/ssr"]
csr     = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
nightly = ["leptos/nightly"]

[dependencies]
leptos         = { workspace = true, default-features = false }
leptos_axum    = { workspace = true, default-features = false }
leptos_meta    = { workspace = true, default-features = false }
leptos_router  = { workspace = true, default-features = false }
serde          = { workspace = true }
common-text    = { path = "../common-text" }

[dev-dependencies]
# NOTE: There is no public `leptos_dom_test` crate on crates.io.
# PR#7 tests use wasm-bindgen-test + wasm-pack (headless chrome) for
# browser interactions and `RenderHtml::to_html()` via `leptos::prelude::*`
# for server-side DOM assertions (SSR mode, `--features ssr`).
