[package]
name = "http-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Axum 0.8 entry point. Leptos SSR + Hydration + Tower MinifluxProxy catch-all layer."

[[bin]]
name = "http-server"
path = "src/main.rs"

[lib]
name = "http_server"
path = "src/lib.rs"

[dependencies]
common-text = { path = "../common-text" }
epub-lib = { path = "../epub-lib" }
progress-db = { path = "../progress-db" }
services = { path = "../services" }
leptos-app = { path = "../leptos-app", features = ["ssr"] }

axum = { workspace = true }
axum-extra = { workspace = true }
reqwest = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
sqlx = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sanitize-filename = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
